<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - TokoKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> TokoKita
                </a>
                <div class="hidden md:flex space-x-8 font-medium">
                    <a href="index.html" class="hover:text-indigo-600 transition">Beranda</a>
                    <a href="products.html" class="hover:text-indigo-600 transition">Produk</a>
                    <a href="contact.html" class="hover:text-indigo-600 transition">Kontak</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="cart.html" class="relative p-2 text-indigo-600">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Keranjang Belanja</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- List Items -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm" id="cart-container">
                <div id="cart-items" class="divide-y divide-gray-200">
                    <!-- Item keranjang diisi via JS -->
                </div>
                <div id="empty-cart-msg" class="hidden text-center py-12">
                    <i class="fa-solid fa-basket-shopping text-5xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500 text-lg">Keranjang Anda masih kosong.</p>
                    <a href="products.html" class="mt-4 inline-block bg-indigo-600 text-white px-6 py-2 rounded-lg">Mulai Belanja</a>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Ringkasan Belanja</h2>
                <div class="space-y-3 border-b pb-4 mb-4 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Total Harga</span>
                        <span id="subtotal-price" class="font-semibold">Rp 0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Pengiriman</span>
                        <span class="text-green-600 font-semibold">Gratis</span>
                    </div>
                </div>
                <div class="flex justify-between text-lg font-bold mb-6">
                    <span>Total</span>
                    <span id="total-price" class="text-indigo-600">Rp 0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold transition">
                    Lanjut ke Pembayaran
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            &copy; 2023 TokoKita. Hak Cipta Dilindungi Undang-Undang.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
