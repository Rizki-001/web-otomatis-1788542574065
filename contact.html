<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami - TokoKita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> TokoKita
                </a>
                <div class="hidden md:flex space-x-8 font-medium">
                    <a href="index.html" class="hover:text-indigo-600 transition">Beranda</a>
                    <a href="products.html" class="hover:text-indigo-600 transition">Produk</a>
                    <a href="contact.html" class="text-indigo-600">Kontak</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="cart.html" class="relative p-2 text-gray-700 hover:text-indigo-600">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
        <h1 class="text-3xl font-bold mb-8 text-gray-800 text-center">Hubungi Kami</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Form Kontak -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-xl font-bold mb-4">Kirim Pesan</h2>
                <form id="contact-form" onsubmit="handleContactSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                        <input type="text" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Pesan</label>
                        <textarea rows="4" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-bold transition">Kirim Pesan</button>
                </form>
            </div>

            <!-- Info Kontak -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm flex items-start space-x-4">
                    <i class="fa-solid fa-location-dot text-2xl text-indigo-600 mt-1"></i>
                    <div>
                        <h3 class="font-bold text-lg">Alamat Toko</h3>
                        <p class="text-gray-600 text-sm">Jl. Sudirman No. 123, Jakarta Selatan, Indonesia</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm flex items-start space-x-4">
                    <i class="fa-solid fa-envelope text-2xl text-indigo-600 mt-1"></i>
                    <div>
                        <h3 class="font-bold text-lg">Email</h3>
                        <p class="text-gray-600 text-sm">support@tokokita.com</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm flex items-start space-x-4">
                    <i class="fa-solid fa-phone text-2xl text-indigo-600 mt-1"></i>
                    <div>
                        <h3 class="font-bold text-lg">Telepon / WhatsApp</h3>
                        <p class="text-gray-600 text-sm">+62 812-3456-7890</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
            &copy; 2023 TokoKita. Hak Cipta Dilindungi Undang-Undang.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
